release_profile: postgres-core
milestone: L1
scope_revision: L1-core-now01-r1
status: blocked_pending_approval
production_integration_allowed: false
execution_registration_allowed: false

baselines:
  design:
    file: ai-devops-platform-design-v1.7.md
    commit: f5a815bf08d356a6b64bdf2a2fbe0161d28dda2e
    sha256: f7b8225ad26a5d390b06380fd627e3b292fd609e3c25539b5b62ba75628cbb85
  implementation_plan:
    file: ai-devops-L0-L1-implementation-plan-v0.1.md
    source_commit: 94473479c71964df26730bedab3e18da6174c3ca
    approved_attachment: vtr-6-plan-v1.0-9447347.md
    attachment_id: 01a0a903-ca64-7630-bce6-ff1b1c6e0ff9
  decisions:
    q1_resource_path: existing_resources
    q2_rls: not_enabled_or_not_claimed
    q3_http: healthz_and_readyz_only

scope:
  install: core_only
  runtime_shape: single_api_single_worker
  persistence: postgres
  http:
    framework: gin
    routes:
    - GET /healthz
    - GET /readyz
  queue: postgres
  workflow_driver: compiled_go_pipeline
  external_operation_registry: compiled_release_registry
  schema_registry: embedded_static
  enabled_capabilities:
  - core.identity_context
  - core.tenant_object_authorization
  - core.workflow_state
  - core.external_operation_ledger
  - core.attempt_and_observation_facts
  - core.postgres_queue_and_outbox
  - core.schema_validation
  - core.audit_and_artifact_references
  - core.health_probes
  required_gates:
  - G01
  - G02
  - G03
  - G04
  exit_conditions:
  - one approved scope revision and sha256 are signed by named product and technical approvers
  - G01 has approved OCR release, fixed sample base/head, runner digest, and success/failure evidence
  - G02 has a named DEFERRED decision bound to this scope revision, four excluded scan capabilities, reason, and revisit trigger
  - G03 has actual OIDC and Feishu test targets, administrators, credential references, and permission evidence
  - G04 has named file/table owners, dependency registry, PG test inputs, threshold owner, and approval reference
  - no unverified candidate is present in the runtime registry

modules:
  identity: {installed: true, enabled: true}
  workflow: {installed: true, enabled: true}
  external_operations: {installed: true, enabled: true}
  queue_outbox: {installed: true, enabled: true}
  schema: {installed: true, enabled: true}
  audit_artifacts: {installed: true, enabled: true}
  review: {installed: false, enabled: false, candidate_only: true}
  notification: {installed: false, enabled: false, candidate_only: true}
  oidc_product_flow: {installed: false, enabled: false, candidate_only: true}
  scan: {installed: false, enabled: false}
  repair: {installed: false, enabled: false}
  intake: {installed: false, enabled: false}
  incident: {installed: false, enabled: false}
  feed: {installed: false, enabled: false}
  agents: {installed: false, enabled: false}

excluded_capabilities:
  items:
  - scan.schedule
  - scan.run
  - scan.report
  - scan.auto_issues
  - l2.real_oidc_integration
  - l2.github_review_integration
  - l2.feishu_delivery_integration
  - l2.product_web_routes
  - repair.agent_execution
  - intake.observation_capture
  - incident.postmortem
  - high_availability_feed
  reason: 仅冻结 L1 core；L2 候选与后续能力不得因文档示例进入运行目录
  revisit: L2 scope 冻结前逐项取得实际资源、契约和签署

future_candidates:
  l2:
    profile: postgres-minimal
    milestone: L2
    source_registry: frontend-build-L2-registry.yaml
    status: candidate_not_approved
    candidates:
      scm: github
      identity: corporate_oidc
      notification: feishu_custom_webhook_bot
    responsibility: 由后续 L2 scope owner 选择实际版本、配置入口和验证负责人
  l3_scan:
    profile: postgres-scan-repair
    milestone: L3
    status: excluded_pending_review
    gate: G02
    no_runtime_registration: true

